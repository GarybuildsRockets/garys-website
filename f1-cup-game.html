<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Cup Shuffle Game | Gary Kanyuh</title>

    <!-- Styles & Scripts -->
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <!-- NAVBAR -->
    <header id="navbar" class="curved-navbar">
        <div class="nav-inner">
            <div class="logo">
                <span class="logo-name">Gary Kanyuh</span>
                <span class="logo-tagline">Mechanical Engineering Student</span>
            </div>

            <!-- Desktop Nav -->
            <nav class="desktop-nav">
                <ul>
                    <li><a href="index.html#home">Home</a></li>
                    <li><a href="index.html#tools">Tools</a></li>
                    <li><a href="index.html#projects">Projects</a></li>
                </ul>
            </nav>

            <!-- Mobile Hamburger -->
            <button class="hamburger" aria-label="Open navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <!-- Mobile Fullscreen Overlay Nav -->
        <div class="mobile-nav-overlay">
            <ul class="mobile-nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#tools">Tools</a></li>
                <li><a href="index.html#projects">Projects</a></li>
            </ul>
        </div>
    </header>

    <main class="game-container">
        <div class="game-card" style="text-align: center;">
            <div class="game-header">
                <h1 class="game-title">F1 PIT LANE CUP SHUFFLE</h1>
                <p class="game-tagline">Find the hidden F1 car beneath the 5 cups!</p>
            </div>

            <div class="stats-panel" style="max-width: 600px; margin: 0 auto 24px;">
                <p id="gameStatus" class="control-label-bold" style="font-size: 16px; color: var(--accent);">
                    Step 1: Select the cup where you want to place the F1 car.
                </p>
                <div style="display: flex; justify-content: center; gap: 20px; margin-top: 12px; font-size: 14px; color: var(--text-muted);">
                    <span>Wins: <strong id="scoreWins" style="color: var(--text-main);">0</strong></span>
                    <span>Losses: <strong id="scoreLosses" style="color: var(--text-main);">0</strong></span>
                </div>
            </div>

            <!-- Cup Table Area -->
            <div id="cupTable" style="display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; min-height: 220px; align-items: center; margin-bottom: 30px;">
                <!-- Generated via Javascript -->
            </div>

            <div style="display: flex; justify-content: center; gap: 12px;">
                <button id="actionBtn" class="primary-btn" style="display: none;">Start Shuffle</button>
                <button id="resetBtn" class="secondary-btn">Restart Game</button>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>© <span id="year"></span> Gary Kanyuh. All rights reserved.</p>
    </footer>

    <style>
        .f1-cup-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .f1-cup-wrapper:hover {
            transform: translateY(-8px);
        }
        .cup-graphic {
            width: 70px;
            height: 90px;
            background: linear-gradient(135deg, #1f293d, #0b1018);
            border: 2px solid var(--border-subtle);
            border-radius: 8px 8px 35px 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            position: relative;
            z-index: 2;
            transition: all 0.4s ease;
        }
        .cup-graphic.lifted {
            transform: translateY(-50px);
            background: linear-gradient(135deg, #25334d, #141b29);
            border-color: var(--accent);
        }
        .cup-number {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-muted);
        }
        .car-hidden-slot {
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 5px;
            z-index: 1;
        }
        .mini-f1-car {
            font-size: 26px;
            animation: bounce 0.6s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-4px); }
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const cupTable = document.getElementById("cupTable");
            const gameStatus = document.getElementById("gameStatus");
            const actionBtn = document.getElementById("actionBtn");
            const resetBtn = document.getElementById("resetBtn");
            const scoreWinsEl = document.getElementById("scoreWins");
            const scoreLossesEl = document.getElementById("scoreLosses");

            let wins = 0;
            let losses = 0;
            let carPosition = null; // 0 to 4
            let gameState = "SETUP"; // SETUP, SHUFFLING, GUESSING, REVEALED
            const totalCups = 5;

            function renderCups(revealCar = false) {
                cupTable.innerHTML = "";
                for (let i = 0; i < totalCups; i++) {
                    const wrapper = document.createElement("div");
                    wrapper.className = "f1-cup-wrapper";
                    
                    const cup = document.createElement("div");
                    cup.className = "cup-graphic";
                    if (revealCar && i === carPosition) {
                        cup.classList.add("lifted");
                    }

                    const numSpan = document.createElement("span");
                    numSpan.className = "cup-number";
                    numSpan.textContent = i + 1;
                    cup.appendChild(numSpan);

                    const carSlot = document.createElement("div");
                    carSlot.className = "car-hidden-slot";
                    
                    if (revealCar && i === carPosition) {
                        const car = document.createElement("span");
                        car.className = "mini-f1-car";
                        car.textContent = "🏎️";
                        carSlot.appendChild(car);
                    }

                    wrapper.appendChild(cup);
                    wrapper.appendChild(carSlot);

                    // Click interactions depending on game state
                    wrapper.addEventListener("click", function () {
                        if (gameState === "SETUP") {
                            carPosition = i;
                            gameStatus.textContent = `Car placed under Cup ${i + 1}. Click 'Start Shuffle'!`;
                            renderCups(true);
                            setTimeout(() => renderCups(false), 800);
                            actionBtn.style.display = "inline-flex";
                        } else if (gameState === "GUESSING") {
                            checkGuess(i);
                        }
                    });

                    cupTable.appendChild(wrapper);
                }
            }

            // Start Shuffle Sequence
            actionBtn.addEventListener("click", async function () {
                if (carPosition === null) return;
                gameState = "SHUFFLING";
                actionBtn.style.display = "none";
                gameStatus.textContent = "🤖 AI is shuffling the pit lane cups...";

                let shuffles = 8;
                let currentPos = carPosition;

                for (let s = 0; s < shuffles; s++) {
                    await new Promise(resolve => setTimeout(resolve, 350));
                    // Random adjacent swap simulation
                    let randomDir = Math.random() < 0.5 ? 1 : -1;
                    let newPos = currentPos + randomDir;
                    if (newPos < 0) newPos = 1;
                    if (newPos >= totalCups) newPos = totalCups - 2;
                    currentPos = newPos;

                    // Visual shift effect
                    cupTable.style.transform = `translateX(${(Math.random() - 0.5) * 15}px)`;
                }

                carPosition = currentPos;
                cupTable.style.transform = "translateX(0px)";
                gameState = "GUESSING";
                gameStatus.textContent = "🏁 Shuffle complete! Choose a cup to find your F1 car.";
            });

            function checkGuess(selectedIdx) {
                gameState = "REVEALED";
                renderCups(true);

                if (selectedIdx === carPosition) {
                    wins++;
                    scoreWinsEl.textContent = wins;
                    gameStatus.textContent = `🎉 Correct! The F1 car was under Cup ${carPosition + 1}! Pole position secured!`;
                    gameStatus.style.color = "#4caf50";
                } else {
                    losses++;
                    scoreLossesEl.textContent = losses;
                    gameStatus.textContent = `💥 Pit stop blunder! The car was under Cup ${carPosition + 1}, not Cup ${selectedIdx + 1}.`;
                    gameStatus.style.color = "var(--danger)";
                }

                actionBtn.textContent = "Play Again";
                actionBtn.style.display = "inline-flex";
                actionBtn.onclick = resetGame;
            }

            function resetGame() {
                gameState = "SETUP";
                carPosition = null;
                gameStatus.textContent = "Step 1: Select the cup where you want to place the F1 car.";
                gameStatus.style.color = "var(--accent)";
                actionBtn.textContent = "Start Shuffle";
                actionBtn.style.display = "none";
                actionBtn.onclick = null;
                
                // Re-bind original start shuffle event
                actionBtn.replaceWith(actionBtn.cloneNode(true));
                document.getElementById("actionBtn").addEventListener("click", startShuffleHandler);

                renderCups(false);
            }

            function startShuffleHandler() {
                // Trigger shuffle logic above
                if (carPosition === null) return;
                gameState = "SHUFFLING";
                document.getElementById("actionBtn").style.display = "none";
                gameStatus.textContent = "🤖 AI is shuffling the pit lane cups...";

                let shuffles = 8;
                let currentPos = carPosition;

                let interval = setInterval(() => {
                    let randomDir = Math.random() < 0.5 ? 1 : -1;
                    let newPos = currentPos + randomDir;
                    if (newPos < 0) newPos = 1;
                    if (newPos >= totalCups) newPos = totalCups - 2;
                    currentPos = newPos;
                }, 300);

                setTimeout(() => {
                    clearInterval(interval);
                    carPosition = currentPos;
                    gameState = "GUESSING";
                    gameStatus.textContent = "🏁 Shuffle complete! Choose a cup to find your F1 car.";
                }, shuffles * 300);
            }

            document.getElementById("actionBtn").addEventListener("click", startShuffleHandler);
            resetBtn.addEventListener("click", resetGame);

            // Initial render
            renderCups(false);
        });
    </script>
</body>
</html>
