<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Cup Shuffle Game | Gary Kanyuh</title>

    <!-- Styles & Scripts -->
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <!-- NAVBAR -->
    <header id="navbar" class="curved-navbar">
        <div class="nav-inner">
            <div class="logo">
                <span class="logo-name">Gary Kanyuh</span>
                <span class="logo-tagline">Mechanical Engineering Student</span>
            </div>

            <!-- Desktop Nav -->
            <nav class="desktop-nav">
                <ul>
                    <li><a href="index.html#home">Home</a></li>
                    <li><a href="index.html#tools">Tools</a></li>
                    <li><a href="index.html#projects">Projects</a></li>
                </ul>
            </nav>

            <!-- Mobile Hamburger -->
            <button class="hamburger" aria-label="Open navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <!-- Mobile Fullscreen Overlay Nav -->
        <div class="mobile-nav-overlay">
            <ul class="mobile-nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#tools">Tools</a></li>
                <li><a href="index.html#projects">Projects</a></li>
            </ul>
        </div>
    </header>

    <main class="game-container">
        <div class="game-card" style="text-align: center;">
            <div class="game-header">
                <h1 class="game-title">F1 PIT LANE CUP SHUFFLE</h1>
                <p class="game-tagline">Track the red Solo cup hiding the F1 car!</p>
            </div>

            <div class="stats-panel" style="max-width: 600px; margin: 0 auto 24px;">
                <p id="gameStatus" class="control-label-bold" style="font-size: 16px; color: var(--accent);">
                    Step 1: Click a red Solo cup to hide the F1 car under it.
                </p>
                <div style="display: flex; justify-content: center; gap: 20px; margin-top: 12px; font-size: 14px; color: var(--text-muted);">
                    <span>Wins: <strong id="scoreWins" style="color: var(--text-main);">0</strong></span>
                    <span>Losses: <strong id="scoreLosses" style="color: var(--text-main);">0</strong></span>
                </div>
            </div>

            <!-- Cup Table Area -->
            <div id="cupTable" style="display: flex; justify-content: center; align-items: flex-end; min-height: 240px; margin-bottom: 30px; position: relative; width: 100%; overflow: hidden; padding: 20px 0;">
                <!-- Generated via Javascript -->
            </div>

            <div style="display: flex; justify-content: center; gap: 12px;">
                <button id="actionBtn" class="primary-btn" style="display: none;">Start Trackable Shuffle</button>
                <button id="resetBtn" class="secondary-btn">Restart Game</button>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>© <span id="year"></span> Gary Kanyuh. All rights reserved.</p>
    </footer>

    <style>
        .f1-cup-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            position: absolute;
            width: 100px;
            transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1);
        }
        /* Realistic Red Solo Cup Design */
        .cup-graphic {
            width: 90px;
            height: 115px;
            background: linear-gradient(135deg, #e63946, #b7091c);
            clip-path: polygon(15% 0%, 85% 0%, 100% 90%, 90% 100%, 10% 100%, 0% 90%);
            position: relative;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6), inset -12px 0 20px rgba(0,0,0,0.3), inset 10px 0 20px rgba(255,255,255,0.25);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 8px;
            z-index: 2;
            transition: transform 0.4s ease, background 0.4s ease;
        }
        /* Classic White Bottom Rim */
        .cup-graphic::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 5%;
            width: 90%;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }
        /* Cup Ridge Line */
        .cup-graphic::before {
            content: "";
            position: absolute;
            top: 55%;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
        }
        .cup-graphic.lifted {
            transform: translateY(-60px);
            background: linear-gradient(135deg, #ff4d5a, #c51b2a);
        }
        .cup-number {
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            z-index: 3;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .car-hidden-slot {
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 5px;
            z-index: 1;
        }
        .mini-f1-car {
            font-size: 30px;
            animation: bounce 0.6s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const cupTable = document.getElementById("cupTable");
            const gameStatus = document.getElementById("gameStatus");
            const actionBtn = document.getElementById("actionBtn");
            const resetBtn = document.getElementById("resetBtn");
            const scoreWinsEl = document.getElementById("scoreWins");
            const scoreLossesEl = document.getElementById("scoreLosses");

            let wins = 0;
            let losses = 0;
            let carIndex = null; // 0 to 4
            let gameState = "SETUP"; // SETUP, SHUFFLING, GUESSING, REVEALED
            const totalCups = 5;
            const slotWidth = 105; // Horizontal spacing between cups

            let cupsData = [];

            function initCups() {
                cupsData = [];
                for (let i = 0; i < totalCups; i++) {
                    cupsData.push({ id: i, currentSlot: i });
                }
                renderCups(false);
            }

            function renderCups(revealCar = false) {
                cupTable.innerHTML = "";
                
                cupsData.forEach((cup) => {
                    const wrapper = document.createElement("div");
                    wrapper.className = "f1-cup-wrapper";
                    // Center the cups container layout dynamically
                    const centerOffset = (cupTable.clientWidth - (totalCups * slotWidth)) / 2;
                    wrapper.style.left = `${Math.max(10, centerOffset + (cup.currentSlot * slotWidth))}px`;

                    const cupEl = document.createElement("div");
                    cupEl.className = "cup-graphic";
                    
                    if (revealCar && cup.id === carIndex) {
                        cupEl.classList.add("lifted");
                    }

                    const numSpan = document.createElement("span");
                    numSpan.className = "cup-number";
                    numSpan.textContent = cup.id + 1;
                    cupEl.appendChild(numSpan);

                    const carSlot = document.createElement("div");
                    carSlot.className = "car-hidden-slot";
                    
                    if (revealCar && cup.id === carIndex) {
                        const car = document.createElement("span");
                        car.className = "mini-f1-car";
                        car.textContent = "🏎️";
                        carSlot.appendChild(car);
                    }

                    wrapper.appendChild(cupEl);
                    wrapper.appendChild(carSlot);

                    wrapper.addEventListener("click", function () {
                        if (gameState === "SETUP") {
                            carIndex = cup.id;
                            gameStatus.textContent = `F1 car placed under Red Cup ${cup.id + 1}. Click 'Start Trackable Shuffle'!`;
                            renderCups(true);
                            setTimeout(() => renderCups(false), 800);
                            actionBtn.style.display = "inline-flex";
                        } else if (gameState === "GUESSING") {
                            checkGuess(cup.id);
                        }
                    });

                    cupTable.appendChild(wrapper);
                });
            }

            // Smooth Trackable Swapping Animation
            async function startShuffle() {
                if (carIndex === null) return;
                gameState = "SHUFFLING";
                actionBtn.style.display = "none";
                gameStatus.textContent = "👀 Keep your eyes on the red Solo cup carrying the F1 car...";

                let totalSwaps = 8;
                for (let s = 0; s < totalSwaps; s++) {
                    await new Promise(resolve => setTimeout(resolve, 500));

                    let idx1 = Math.floor(Math.random() * totalCups);
                    let idx2;
                    do {
                        idx2 = Math.floor(Math.random() * totalCups);
                    } while (idx2 === idx1);

                    let cupA = cupsData.find(c => c.currentSlot === idx1);
                    let cupB = cupsData.find(c => c.currentSlot === idx2);

                    let temp = cupA.currentSlot;
                    cupA.currentSlot = cupB.currentSlot;
                    cupB.currentSlot = temp;

                    renderCups(false);
                }

                gameState = "GUESSING";
                gameStatus.textContent = "🏁 Shuffle complete! Choose a red Solo cup to find your F1 car.";
            }

            function checkGuess(selectedCupId) {
                gameState = "REVEALED";
                renderCups(true);

                if (selectedCupId === carIndex) {
                    wins++;
                    scoreWinsEl.textContent = wins;
                    gameStatus.textContent = `🎉 Spot on! The F1 car was under Red Cup ${carIndex + 1}! Pole position secured!`;
                    gameStatus.style.color = "#4caf50";
                } else {
                    losses++;
                    scoreLossesEl.textContent = losses;
                    gameStatus.textContent = `💥 Pit stop blunder! The F1 car was actually under Red Cup ${carIndex + 1}.`;
                    gameStatus.style.color = "var(--danger)";
                }

                actionBtn.textContent = "Play Again";
                actionBtn.style.display = "inline-flex";
            }

            function resetGame() {
                gameState = "SETUP";
                carIndex = null;
                gameStatus.textContent = "Step 1: Click a red Solo cup to hide the F1 car under it.";
                gameStatus.style.color = "var(--accent)";
                actionBtn.textContent = "Start Trackable Shuffle";
                actionBtn.style.display = "none";
                initCups();
            }

            actionBtn.addEventListener("click", function() {
                if (gameState === "SETUP") {
                    startShuffle();
                } else if (gameState === "REVEALED") {
                    resetGame();
                }
            });

            resetBtn.addEventListener("click", resetGame);

            initCups();
        });
    </script>
</body>
</html>
