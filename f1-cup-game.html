<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Cup Shuffle Game | Gary Kanyuh</title>

    <!-- Styles & Scripts -->
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <!-- NAVBAR -->
    <header id="navbar" class="curved-navbar">
        <div class="nav-inner">
            <div class="logo">
                <span class="logo-name">Gary Kanyuh</span>
                <span class="logo-tagline">Mechanical Engineering Student</span>
            </div>

            <!-- Desktop Nav -->
            <nav class="desktop-nav">
                <ul>
                    <li><a href="index.html#home">Home</a></li>
                    <li><a href="index.html#tools">Tools</a></li>
                    <li><a href="index.html#projects">Projects</a></li>
                </ul>
            </nav>

            <!-- Mobile Hamburger -->
            <button class="hamburger" aria-label="Open navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <!-- Mobile Fullscreen Overlay Nav -->
        <div class="mobile-nav-overlay">
            <ul class="mobile-nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#tools">Tools</a></li>
                <li><a href="index.html#projects">Projects</a></li>
            </ul>
        </div>
    </header>

    <main class="game-container">
        <div class="game-card" style="text-align: center;">
            <div class="game-header">
                <h1 class="game-title">F1 PIT LANE CUP SHUFFLE</h1>
                <p class="game-tagline">Track the Solo cup hiding the F1 car!</p>
            </div>

            <div class="stats-panel" style="max-width: 600px; margin: 0 auto 24px;">
                <p id="gameStatus" class="control-label-bold" style="font-size: 16px; color: var(--accent);">
                    Step 1: Click a Solo cup to hide the F1 car under it.
                </p>
                <div style="display: flex; justify-content: center; gap: 20px; margin-top: 12px; font-size: 14px; color: var(--text-muted);">
                    <span>Wins: <strong id="scoreWins" style="color: var(--text-main);">0</strong></span>
                    <span>Losses: <strong id="scoreLosses" style="color: var(--text-main);">0</strong></span>
                </div>
            </div>

            <!-- Cup Table Area -->
            <div id="cupTable" style="display: flex; justify-content: center; gap: 12px; min-height: 240px; align-items: flex-end; margin-bottom: 30px; position: relative; overflow: hidden; padding: 20px 0;">
                <!-- Generated via Javascript -->
            </div>

            <div style="display: flex; justify-content: center; gap: 12px;">
                <button id="actionBtn" class="primary-btn" style="display: none;">Start Trackable Shuffle</button>
                <button id="resetBtn" class="secondary-btn">Restart Game</button>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>© <span id="year"></span> Gary Kanyuh. All rights reserved.</p>
    </footer>

    <style>
        .cup-slot {
            position: relative;
            width: 85px;
            height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.4s ease-in-out;
        }
        .f1-cup-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            position: absolute;
            width: 85px;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .cup-graphic {
            width: 80px;
            height: 105px;
            background: linear-gradient(135deg, #1f293d, #0b1018);
            border-top: 5px solid var(--accent); /* Rolled rim effect */
            clip-path: polygon(12% 0%, 88% 0%, 96% 100%, 4% 100%); /* Solo cup trapezoid shape */
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 25px rgba(0,0,0,0.6);
            position: relative;
            z-index: 2;
            transition: transform 0.4s ease;
        }
        .cup-graphic.lifted {
            transform: translateY(-55px);
            background: linear-gradient(135deg, #2b3b57, #141b29);
            border-top-color: #4caf50;
        }
        .cup-number {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            margin-top: 15px;
        }
        .car-hidden-slot {
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 5px;
            z-index: 1;
        }
        .mini-f1-car {
            font-size: 28px;
            animation: bounce 0.6s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-4px); }
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const cupTable = document.getElementById("cupTable");
            const gameStatus = document.getElementById("gameStatus");
            const actionBtn = document.getElementById("actionBtn");
            const resetBtn = document.getElementById("resetBtn");
            const scoreWinsEl = document.getElementById("scoreWins");
            const scoreLossesEl = document.getElementById("scoreLosses");

            let wins = 0;
            let losses = 0;
            let carIndex = null; // Which cup index currently holds the car (0 to 4)
            let cupPositions = [0, 1, 2, 3, 4]; // Maps visual slot index to original cup object
            let gameState = "SETUP"; // SETUP, SHUFFLING, GUESSING, REVEALED
            const totalCups = 5;
            const slotWidth = 97; // Pixels distance between cup slots for sliding animation

            let cupsData = [];

            function initCups() {
                cupsData = [];
                for (let i = 0; i < totalCups; i++) {
                    cupsData.push({ id: i, currentSlot: i });
                }
                renderCups(false);
            }

            function renderCups(revealCar = false) {
                cupTable.innerHTML = "";
                
                // Create relative positioning tracks
                cupsData.forEach((cup, idx) => {
                    const wrapper = document.createElement("div");
                    wrapper.className = "f1-cup-wrapper";
                    wrapper.style.transform = `translateX(${cup.currentSlot * slotWidth}px)`;

                    const cupEl = document.createElement("div");
                    cupEl.className = "cup-graphic";
                    
                    if (revealCar && cup.id === carIndex) {
                        cupEl.classList.add("lifted");
                    }

                    const numSpan = document.createElement("span");
                    numSpan.className = "cup-number";
                    numSpan.textContent = cup.id + 1;
                    cupEl.appendChild(numSpan);

                    const carSlot = document.createElement("div");
                    carSlot.className = "car-hidden-slot";
                    
                    if (revealCar && cup.id === carIndex) {
                        const car = document.createElement("span");
                        car.className = "mini-f1-car";
                        car.textContent = "🏎️";
                        carSlot.appendChild(car);
                    }

                    wrapper.appendChild(cupEl);
                    wrapper.appendChild(carSlot);

                    // Click interaction
                    wrapper.addEventListener("click", function () {
                        if (gameState === "SETUP") {
                            carIndex = cup.id;
                            gameStatus.textContent = `F1 car placed under Cup ${cup.id + 1}. Click 'Start Trackable Shuffle'!`;
                            renderCups(true);
                            setTimeout(() => renderCups(false), 800);
                            actionBtn.style.display = "inline-flex";
                        } else if (gameState === "GUESSING") {
                            checkGuess(cup.id);
                        }
                    });

                    cupTable.appendChild(wrapper);
                });
            }

            // Smooth Trackable Swap Animation
            async function startShuffle() {
                if (carIndex === null) return;
                gameState = "SHUFFLING";
                actionBtn.style.display = "none";
                gameStatus.textContent = "👀 Keep your eyes on the Solo cup with the F1 car...";

                let totalSwaps = 7; // Number of trackable swaps
                for (let s = 0; s < totalSwaps; s++) {
                    await new Promise(resolve => setTimeout(resolve, 550));

                    // Pick two adjacent or random slots to swap
                    let idx1 = Math.floor(Math.random() * totalCups);
                    let idx2;
                    do {
                        idx2 = Math.floor(Math.random() * totalCups);
                    } while (idx2 === idx1);

                    // Find cups currently occupying these slots
                    let cupA = cupsData.find(c => c.currentSlot === idx1);
                    let cupB = cupsData.find(c => c.currentSlot === idx2);

                    // Swap their slot positions
                    let temp = cupA.currentSlot;
                    cupA.currentSlot = cupB.currentSlot;
                    cupB.currentSlot = temp;

                    renderCups(false);
                }

                gameState = "GUESSING";
                gameStatus.textContent = "🏁 Shuffle complete! Which Solo cup is the F1 car hiding under?";
            }

            function checkGuess(selectedCupId) {
                gameState = "REVEALED";
                renderCups(true);

                if (selectedCupId === carIndex) {
                    wins++;
                    scoreWinsEl.textContent = wins;
                    gameStatus.textContent = `🎉 Spot on! The F1 car was under Cup ${carIndex + 1}! Pole position secured!`;
                    gameStatus.style.color = "#4caf50";
                } else {
                    losses++;
                    scoreLossesEl.textContent = losses;
                    gameStatus.textContent = `💥 Miscalculation! The F1 car was actually under Cup ${carIndex + 1}.`;
                    gameStatus.style.color = "var(--danger)";
                }

                actionBtn.textContent = "Play Again";
                actionBtn.style.display = "inline-flex";
            }

            function resetGame() {
                gameState = "SETUP";
                carIndex = null;
                gameStatus.textContent = "Step 1: Click a Solo cup to hide the F1 car under it.";
                gameStatus.style.color = "var(--accent)";
                actionBtn.textContent = "Start Trackable Shuffle";
                actionBtn.style.display = "none";
                initCups();
            }

            actionBtn.addEventListener("click", function() {
                if (gameState === "SETUP") {
                    startShuffle();
                } else if (gameState === "REVEALED") {
                    resetGame();
                }
            });

            resetBtn.addEventListener("click", resetGame);

            // Initial Setup
            initCups();
        });
    </script>
</body>
</html>
